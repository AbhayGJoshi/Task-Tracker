directories:
  output: release
  buildResources: build
appId: com.tasktracker.app
productName: Task Tracker
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 43.4.0
